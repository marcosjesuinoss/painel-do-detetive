<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-label="Splash Investiga??o">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1224"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect width="1080" height="1920" fill="url(#glow)"/>

  <!-- Marca -->
  <g transform="translate(540 760)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="180" fill="none" stroke="#e2e8f0" stroke-width="30" opacity="0.95"/>
    <path d="M120 120 L250 250" fill="none" stroke="#e2e8f0" stroke-width="34" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="18" fill="#fbbf24"/>
  </g>

  <text x="540" y="1180" text-anchor="middle"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
        font-size="68" font-weight="800" fill="#e2e8f0">Investiga??o</text>
  <text x="540" y="1255" text-anchor="middle"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
        font-size="34" font-weight="500" fill="#94a3b8">Painel do Detetive</text>
</svg>
